<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ôn tập Kiến trúc máy tính · 300 câu</title>
    <style>
      :root {
        --ink: #17332e;
        --muted: #687872;
        --brand: #126b58;
        --paper: #f5f5ee;
        --line: #dce5dd;
        --white: #fff;
        --red: #ab3438;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.6 "Segoe UI",
          Arial,
          sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #e4a23a;
        outline-offset: 3px;
      }
      button:disabled {
        cursor: default;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .bar {
        max-width: 1200px;
        margin: auto;
        padding: 17px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .wordmark {
        font-weight: 750;
        font-size: 18px;
        letter-spacing: -0.5px;
      }
      .badge {
        font-size: 12px;
        font-weight: 650;
        color: var(--brand);
        background: #e8f2e9;
        padding: 5px 12px;
        border-radius: 30px;
      }
      .wrap {
        max-width: 1200px;
        margin: auto;
        padding: 42px 28px;
      }
      .eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--brand);
        font-weight: 750;
      }
      h1 {
        font-size: 46px;
        line-height: 1.15;
        letter-spacing: -1.8px;
        margin: 14px 0 18px;
      }
      h2 {
        font-size: 24px;
        line-height: 1.4;
        margin: 0 0 18px;
      }
      p {
        margin: 0 0 18px;
      }
      .intro {
        max-width: 740px;
        color: var(--muted);
        font-size: 18px;
      }
      .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin: 26px 0 38px;
        font-size: 14px;
      }
      .fact b {
        font-size: 25px;
        color: var(--brand);
        margin-right: 7px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .card {
        padding: 24px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        text-align: left;
        transition: 0.15s;
      }
      .card:hover {
        transform: translateY(-3px);
        border-color: var(--brand);
      }
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card h2 {
        margin: 14px 0 8px;
      }
      .small {
        font-size: 13px;
        color: var(--muted);
      }
      .track {
        height: 7px;
        background: #e8ece6;
        border-radius: 20px;
        overflow: hidden;
        margin: 18px 0 10px;
      }
      .fill {
        height: 100%;
        background: var(--brand);
        transition: width 0.2s;
      }
      .go {
        font-weight: 650;
        color: var(--brand);
      }
      .footer {
        margin-top: 34px;
        color: var(--muted);
        font-size: 13px;
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }
      .footer a {
        color: var(--brand);
      }
      .primary,
      .secondary {
        border-radius: 10px;
        padding: 10px 19px;
        border: 1px solid var(--brand);
        font-weight: 650;
      }
      .primary {
        background: var(--brand);
        color: #fff;
      }
      .secondary {
        background: #fff;
        color: var(--brand);
      }
      .quiet {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 8px 0;
      }
      .quiz-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 24px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        gap: 24px;
        align-items: start;
      }
      .sheet {
        padding: 32px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .stem {
        font-size: 23px;
        line-height: 1.5;
        font-weight: 650;
        white-space: pre-wrap;
      }
      .option {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        width: 100%;
        text-align: left;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin: 12px 0;
        padding: 16px 18px;
        color: var(--ink);
        transition: 0.15s;
      }
      .option:hover:not(:disabled) {
        border-color: var(--brand);
        background: #f4faf6;
      }
      .letter {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #f0f3ed;
        font-weight: 700;
      }
      .option.good {
        background: #edf7ee;
        border-color: #359563;
      }
      .option.bad {
        background: #fff1ef;
        border-color: #c56565;
      }
      .option.good .letter {
        background: #267d54;
        color: white;
      }
      .option.bad .letter {
        background: #b14c4c;
        color: white;
      }
      .result {
        padding: 20px;
        border-radius: 12px;
        background: #eff7ef;
        margin-top: 20px;
      }
      .result.wrong {
        background: #fff4ee;
      }
      .result b {
        display: block;
        margin-bottom: 7px;
      }
      .result p {
        font-size: 15px;
        margin: 0;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 26px;
      }
      .nav {
        padding: 22px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .nav h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .jump {
        width: 100%;
        padding: 8px 0;
        border: 1px solid var(--line);
        background: #fafbf8;
        border-radius: 7px;
        font-size: 13px;
        color: var(--ink);
      }
      .jump.active {
        outline: 2px solid var(--brand);
        outline-offset: 1px;
      }
      .jump.ok {
        background: #daf0dd;
        color: #205937;
      }
      .jump.no {
        background: #ffe2df;
        color: #903b37;
      }
      .legend {
        font-size: 12px;
        color: var(--muted);
        margin: 15px 0;
      }
      .note {
        background: #fff8df;
        color: #746128;
        padding: 10px 14px;
        font-size: 13px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .diagram {
        display: block;
        max-width: 100%;
        max-height: 700px;
        margin: 15px auto;
        object-fit: contain;
        border-radius: 8px;
      }
      .finish {
        padding: 38px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .bigscore {
        font-size: 66px;
        font-weight: 750;
        color: var(--brand);
        line-height: 1.2;
        letter-spacing: -2px;
      }
      .summary-row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      .summary-row span {
        background: var(--paper);
        padding: 12px 20px;
        border-radius: 10px;
      }
      .review {
        border-top: 1px solid var(--line);
        padding: 14px 0;
      }
      .review button {
        text-align: left;
        background: none;
        border: 0;
        color: var(--brand);
      }
      details {
        margin-top: 20px;
      }
      summary {
        cursor: pointer;
        color: var(--brand);
      }
      .saved {
        color: var(--muted);
        font-size: 12px;
      }
      .toast {
        font-size: 13px;
        color: #ab3438;
        padding: 10px 0;
      }
      .nojs {
        padding: 25px;
        background: #fff2de;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .nav {
          order: 2;
        }
        .grid {
          grid-template-columns: repeat(10, 1fr);
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        h1 {
          font-size: 38px;
        }
      }
      @media (max-width: 580px) {
        .bar {
          padding: 14px 18px;
        }
        .wrap {
          padding: 26px 16px;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .sheet {
          padding: 22px 18px;
        }
        .stem {
          font-size: 20px;
        }
        h1 {
          font-size: 34px;
        }
        .badge {
          display: none;
        }
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
        .quiz-top {
          align-items: flex-start;
        }
        .facts {
          gap: 15px;
        }
        .option {
          padding: 13px;
        }
        .actions {
          flex-wrap: wrap;
        }
        .bigscore {
          font-size: 52px;
        }
      }
    </style>
  </head>

        ).join(
          "",
        )}</div><div class="footer"><p>Đáp án được giải lại từ PDF. Một số phương án hoặc cách diễn đạt đã được sửa để có đáp án rõ ràng; các câu đó có ghi chú và giải thích. Giữ thứ tự câu hỏi và đáp án A–D. Không giới hạn thời gian.</p><p class="saved">${storageOK ? "Tiến độ được lưu trên trình duyệt này. Bạn có thể đóng và mở lại file để tiếp tục." : "Trình duyệt đang chặn lưu tiến độ; bạn vẫn làm bài được trong phiên hiện tại."}</p><details><summary>Tài liệu đối chiếu và quy ước</summary><p style="margin-top:12px">Nguồn câu hỏi: “300 câu hỏi kiến trúc máy tính.pdf”, 53 trang. Các câu về phân loại, công đoạn CPU và mode địa chỉ dùng mô hình của giáo trình. MB/KB trong bài tính được hiểu là lũy thừa của 2; địa chỉ ngăn nhớ có thể theo từ nhớ như đề chỉ định. Định dạng extended dùng mô hình x87 80 bit. Công thức số thực xét số chuẩn hóa.</p><p><a href="https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html" target="_blank" rel="noopener">Intel — kiến trúc, lệnh và cờ</a> · <a href="https://docs.oracle.com/cd/E19957-01/801-7639/801-7639.pdf" target="_blank" rel="noopener">Oracle — IEEE 754</a> · <a href="https://unicode.org/faq/utf_bom.html" target="_blank" rel="noopener">Unicode — các dạng mã hóa</a> · <a href="https://www.rfc-editor.org/rfc/rfc20.html" target="_blank" rel="noopener">RFC 20 — ASCII</a> · <a href="https://www.eecg.toronto.edu/~steffan/teaching/permanent/ece243/cache_lecture/" target="_blank" rel="noopener">University of Toronto — cache</a> · <a href="https://www.intel.com/content/www/us/en/newsroom/resources/moores-law.html" target="_blank" rel="noopener">Intel — định luật Moore</a> · <a href="https://penntoday.upenn.edu/news/penns-eniac-worlds-first-electronic-computer-turns-80" target="_blank" rel="noopener">Penn — ENIAC</a></p></details></div>`;
        app
          .querySelectorAll("[data-start]")
          .forEach((b) => (b.onclick = () => start(+b.dataset.start)));
        window.scrollTo(0, 0);
      }
      function start(n) {
        batch = n;
        const remembered = store.positions[n];
        pos =
          Number.isInteger(remembered) && remembered >= 0 && remembered < 50
            ? remembered
            : Math.max(
                0,
                subset(n).findIndex((q) => !store.answers[q.id]),
              );
        render();
        window.scrollTo(0, 0);
      }
      function move(i) {
        pos = Math.max(0, Math.min(49, i));
        store.positions[batch] = pos;
        save();
        render();
        window.scrollTo(0, 0);
      }
      function render() {
        const qs = subset(batch),
          q = qs[pos],
          a = store.answers[q.id],
          s = stats(batch);
        app.innerHTML = `<div class="quiz-top"><div><div class="eyebrow">Bài ${batch + 1} · Câu ${batch * 50 + 1}–${batch * 50 + 50}</div><div class="small">Chọn một đáp án. Kết quả được ghi nhận ở lần chọn đầu tiên.</div></div><button class="secondary" id="finish">Xem kết quả</button></div><div class="layout"><section class="sheet"><div class="meta"><span>Câu ${pos + 1}/50 · Số thứ tự ${q.number}</span><span>Mã trong PDF: ${esc(q.id)}</span></div>${q.note ? `<p class="note">Đã hiệu chỉnh từ đề gốc để làm rõ kiến thức.</p>` : ""}<h2 class="stem">${esc(q.stem)}</h2>${q.image ? `<img class="diagram" src="${q.image}" alt="Sơ đồ hoặc bảng dữ liệu câu ${q.id}">` : ""}<div id="options">${q.options.map((o) => `<button class="option ${a ? (o.label === q.answer ? "good" : o.label === a ? "bad" : "") : ""}" data-answer="${o.label}" ${a ? "disabled" : ""}><span class="letter">${o.label.toUpperCase()}</span><span>${esc(o.text)} ${a && o.label === q.answer ? "✓" : ""}${a && o.label === a && a !== q.answer ? "✕" : ""}</span></button>`).join("")}</div><div aria-live="polite" aria-atomic="true">${a ? `<div class="result ${a !== q.answer ? "wrong" : ""}"><b>${a === q.answer ? "Chính xác!" : "Chưa đúng."} Đáp án đúng: ${q.answer.toUpperCase()}.</b><p>${esc(q.why)}</p>${q.note ? `<p style="margin-top:9px;color:#786747">${esc(q.note)}</p>` : ""}</div>` : ""}</div><div class="actions"><button class="secondary" id="prev" ${pos === 0 ? "disabled" : ""}>← Câu trước</button><button class="primary" id="next">${pos === 49 ? "Kết quả bài" : "Câu tiếp theo →"}</button></div><p class="saved" style="margin:14px 0 0">${storageOK ? "Tiến độ được lưu tự động." : "Không lưu được tiến độ trên trình duyệt này."}</p></section><aside class="nav"><h3>Tiến độ bài ${batch + 1}</h3><div class="small">${s.done}/50 đã trả lời · ${s.correct} đúng</div><div class="track"><div class="fill" style="width:${s.done * 2}%"></div></div><div class="grid">${qs.map((x, i) => `<button class="jump ${i === pos ? "active" : ""} ${store.answers[x.id] ? (store.answers[x.id] === x.answer ? "ok" : "no") : ""}" data-pos="${i}" aria-label="Câu ${i + 1}${store.answers[x.id] ? (store.answers[x.id] === x.answer ? ", đã trả lời đúng" : ", đã trả lời sai") : ", chưa trả lời"}" ${i === pos ? 'aria-current="step"' : ""}>${i + 1}</button>`).join("")}</div><p class="legend">Xanh: đúng · Đỏ: sai<br>Ô trắng: chưa trả lời</p><button class="quiet" id="reset">Làm lại bài này</button></aside></div>`;
        app
          .querySelectorAll("[data-answer]")
          .forEach((b) => (b.onclick = () => answer(b.dataset.answer)));
        app
          .querySelectorAll("[data-pos]")
          .forEach((b) => (b.onclick = () => move(+b.dataset.pos)));
        document.getElementById("prev").onclick = () => move(pos - 1);
        document.getElementById("next").onclick = () =>
          pos === 49 ? finish() : move(pos + 1);
        document.getElementById("finish").onclick = finish;
        document.getElementById("reset").onclick = reset;
      }
      function answer(label) {
        const q = subset(batch)[pos];
        if (store.answers[q.id]) return;
        store.answers[q.id] = label;
        store.positions[batch] = pos;
        save();
        render();
      }
      function reset() {
        app.innerHTML = `<section class="finish"><h2>Làm lại bài ${batch + 1}?</h2><p>Các câu trả lời và điểm của bài này sẽ được xóa. Tiến độ các bài khác được giữ lại.</p><div class="actions"><button class="secondary" id="cancel-reset">Giữ tiến độ</button><button class="primary" id="confirm-reset">Bắt đầu lại</button></div></section>`;
        document.getElementById("cancel-reset").onclick = render;
        document.getElementById("confirm-reset").onclick = doReset;
      }
      function doReset() {
        for (const q of subset(batch)) delete store.answers[q.id];
        pos = 0;
        store.positions[batch] = 0;
        save();
        render();
        window.scrollTo(0, 0);
      }
      function finish() {
        const qs = subset(batch),
          s = stats(batch),
          wrong = qs
            .map((q, i) => ({ q, i }))
            .filter(
              (x) =>
                store.answers[x.q.id] && store.answers[x.q.id] !== x.q.answer,
            );
        app.innerHTML = `<section class="finish"><div class="eyebrow">Kết quả bài ${batch + 1}</div><h1>${s.done === 50 ? "Bạn đã hoàn thành bài." : "Tiến độ hiện tại của bạn."}</h1><div class="bigscore">${s.correct}<span style="font-size:28px;color:#84938b"> / 50</span></div><div class="summary-row"><span><b>${s.correct}</b> câu đúng</span><span><b>${s.done - s.correct}</b> câu sai</span><span><b>${50 - s.done}</b> chưa trả lời</span></div><p class="small">Điểm trên thang 10: ${(s.correct / 5).toFixed(1)}. Mỗi câu đúng được 0,2 điểm; câu chưa trả lời chưa có điểm.</p><div class="actions"><button class="secondary" id="back">Quay lại bài</button><button class="primary" id="again">Làm lại bài này</button></div>${s.done < 50 ? '<button class="quiet" id="remaining">Tiếp tục câu chưa trả lời →</button>' : ""}${wrong.length ? `<h2 style="margin-top:30px">Xem lại ${wrong.length} câu sai</h2>${wrong.map((x) => `<div class="review"><button data-review="${x.i}">Câu ${x.i + 1} · Mã ${x.q.id} — Bạn chọn ${store.answers[x.q.id].toUpperCase()}, đáp án ${x.q.answer.toUpperCase()} →</button></div>`).join("")}` : '<p style="margin-top:24px">Chưa có câu trả lời sai trong bài này.</p>'}</section>`;
        document.getElementById("back").onclick = render;
        document.getElementById("again").onclick = reset;
        if (s.done < 50)
          document.getElementById("remaining").onclick = () =>
            move(qs.findIndex((q) => !store.answers[q.id]));
        app
          .querySelectorAll("[data-review]")
          .forEach((b) => (b.onclick = () => move(+b.dataset.review)));
        window.scrollTo(0, 0);
      }
      document.getElementById("home").onclick = home;
      document.addEventListener("keydown", (e) => {
        if (
          batch === null ||
          !document.getElementById("options") ||
          ["INPUT", "TEXTAREA", "SELECT"].includes(
            document.activeElement.tagName,
          ) ||
          e.altKey ||
          e.ctrlKey ||
          e.metaKey
        )
          return;
        if (["1", "2", "3", "4"].includes(e.key)) {
          e.preventDefault();
          answer("abcd"[+e.key - 1]);
        }
        if (e.key === "ArrowRight" && pos < 49) {
          e.preventDefault();
          move(pos + 1);
        }
        if (e.key === "ArrowLeft" && pos > 0) {
          e.preventDefault();
          move(pos - 1);
        }
      });
      home();
    </script>
  </body>
</html>
